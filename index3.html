<script>
/* =========================================================
   SUPPLAB — PRODUCT SYSTEM
   Keeps the existing website structure
   77 products / 5 company sections
   ========================================================= */

/* ---------------------------------------------------------
   1. CENTRAL PRODUCT DATABASE
   Your existing 77 products remain the source of truth.
   Keep your existing products array above this script if
   you already have it.
   --------------------------------------------------------- */

/*
   IMPORTANT:
   Your existing 77-product array should be named:

   const products = [...]

   Every product should contain at least:

   id
   company
   brand
   name
   price
   oldPrice
   rating
   reviews
   badge
   icon
   category

   Example:

   {
      id: 1,
      company: "iherb",
      brand: "Doctor's Best",
      name: "High Absorption Magnesium Lysinate Glycinate",
      price: 23.99,
      oldPrice: 29.99,
      rating: 4.8,
      reviews: 212108,
      badge: "Best Seller",
      icon: "💊",
      category: "minerals"
   }
*/


/* =========================================================
   2. SUPPLAB STATE
   ========================================================= */

let cart = JSON.parse(localStorage.getItem("supplab_cart") || "[]");
let wishlist = JSON.parse(localStorage.getItem("supplab_wishlist") || "[]");

let activeCompany = "all";
let activeCategory = "all";
let activeSearch = "";

let dealHours = 4;
let dealMinutes = 32;
let dealSeconds = 15;


/* =========================================================
   3. COMPANY INFORMATION
   ========================================================= */

const companyInfo = {
    iherb: {
        name: "iHerb",
        description: "Vitamins, supplements, beauty, grocery, personal care and wellness products.",
        className: "iherb"
    },

    "different-pharm": {
        name: "Different Pharm",
        description: "Sports nutrition, vitamins, performance and wellness products.",
        className: "different-pharm"
    },

    lazar: {
        name: "Lazar Nutrition",
        description: "Sports nutrition, protein, performance and bodybuilding products.",
        className: "lazar"
    },

    myprotein: {
        name: "MyProtein",
        description: "Protein, sports nutrition, snacks, vitamins and training essentials.",
        className: "myprotein"
    },

    california: {
        name: "California Gold Nutrition",
        description: "Vitamins, probiotics, omega-3, beauty and wellness products.",
        className: "california"
    }
};


/* =========================================================
   4. HELPERS
   ========================================================= */

function money(value) {
    return "€" + Number(value || 0).toFixed(2);
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getProduct(id) {
    return products.find(p => Number(p.id) === Number(id));
}

function getCompanyProducts(company) {
    return products.filter(p => p.company === company);
}

function getCategoryProducts(category) {
    return products.filter(p => p.category === category);
}


/* =========================================================
   5. COMPANY COUNTS
   Automatically calculates 30 / 15 / 15 / 10 / 7
   from the actual product database.
   ========================================================= */

function updateCompanyCounts() {

    document.querySelectorAll(".brand-card").forEach(card => {

        const onclick = card.getAttribute("onclick") || "";

        const match = onclick.match(/filterByBrand\(['"]([^'"]+)/);

        if (!match) return;

        const company = match[1];
        const count = getCompanyProducts(company).length;

        const countElement = card.querySelector("p");

        if (countElement) {
            countElement.textContent =
                `${count} Product${count === 1 ? "" : "s"}`;
        }
    });
}


/* =========================================================
   6. PRODUCT CARD
   ========================================================= */

function createProductCard(product) {

    const isWishlisted = wishlist.includes(Number(product.id));

    const discount =
        product.oldPrice && Number(product.oldPrice) > Number(product.price)
            ? Math.round(
                ((Number(product.oldPrice) - Number(product.price)) /
                Number(product.oldPrice)) * 100
              )
            : 0;

    return `
        <article class="product-card"
                 data-product-id="${product.id}"
                 onclick="openProduct(${product.id})">

            <div class="product-card-top">

                <span class="company-badge ${escapeHTML(product.company)}">
                    ${escapeHTML(
                        companyInfo[product.company]?.name ||
                        product.company
                    )}
                </span>

                ${
                    product.badge
                    ? `<span class="product-badge">
                        ${escapeHTML(product.badge)}
                       </span>`
                    : ""
                }

                <button
                    class="wishlist-button ${isWishlisted ? "active" : ""}"
                    onclick="event.stopPropagation(); toggleWishlist(${product.id})"
                    aria-label="Wishlist">
                    ${isWishlisted ? "♥" : "♡"}
                </button>

            </div>

            <div class="product-image">

                ${
                    product.image
                    ? `<img
                        src="${escapeHTML(product.image)}"
                        alt="${escapeHTML(product.name)}"
                        loading="lazy"
                       >`
                    : `<div class="product-icon">
                        ${product.icon || "🛍️"}
                       </div>`
                }

            </div>

            <div class="product-info">

                <div class="product-brand">
                    ${escapeHTML(product.brand || "")}
                </div>

                <h3 class="product-name">
                    ${escapeHTML(product.name)}
                </h3>

                <div class="product-rating">
                    <span class="stars">
                        ${createStars(product.rating)}
                    </span>

                    <span>
                        ${Number(product.rating || 0).toFixed(1)}
                    </span>

                    <span class="reviews">
                        (${Number(product.reviews || 0).toLocaleString()})
                    </span>
                </div>

                <div class="product-price-row">

                    <strong class="product-price">
                        ${money(product.price)}
                    </strong>

                    ${
                        product.oldPrice
                        ? `<span class="product-old-price">
                            ${money(product.oldPrice)}
                           </span>`
                        : ""
                    }

                    ${
                        discount
                        ? `<span class="discount">
                            -${discount}%
                           </span>`
                        : ""
                    }

                </div>

                <button
                    class="add-cart-button"
                    onclick="event.stopPropagation(); addToCart(${product.id})">
                    🛒 Add to Cart
                </button>

            </div>

        </article>
    `;
}


/* =========================================================
   7. STARS
   ========================================================= */

function createStars(rating) {

    const value = Number(rating || 0);

    let output = "";

    for (let i = 1; i <= 5; i++) {
        output += i <= Math.round(value) ? "★" : "☆";
    }

    return output;
}


/* =========================================================
   8. MOVING CAROUSEL
   ========================================================= */

function createCarouselCard(product) {

    return `
        <article
            class="carousel-product"
            onclick="openProduct(${product.id})">

            <div class="carousel-image">

                ${
                    product.image
                    ? `<img
                        src="${escapeHTML(product.image)}"
                        alt="${escapeHTML(product.name)}"
                        loading="lazy"
                       >`
                    : `<span>
                        ${product.icon || "🛍️"}
                       </span>`
                }

            </div>

            <div class="carousel-company">
                ${escapeHTML(
                    companyInfo[product.company]?.name ||
                    product.company
                )}
            </div>

            <div class="carousel-name">
                ${escapeHTML(product.name)}
            </div>

            <div class="carousel-price">
                ${money(product.price)}
            </div>

        </article>
    `;
}


/* =========================================================
   9. RENDER MOVING CAROUSEL
   Keeps your existing carousel.
   ========================================================= */

function renderCarousel() {

    const carousel = document.querySelector(
        ".carousel-track"
    );

    if (!carousel) return;

    /*
       Pull discounted / promoted products first.
       Then fill the carousel from the 77-product catalog.
    */

    let featured = products.filter(p =>
        p.oldPrice ||
        p.badge
    );

    if (featured.length < 35) {

        const remaining = products.filter(
            p => !featured.includes(p)
        );

        featured = [
            ...featured,
            ...remaining
        ];
    }

    featured = featured.slice(0, 35);

    /*
       Duplicate the list so the CSS animation can
       create a continuous moving carousel.
    */

    carousel.innerHTML =
        featured.map(createCarouselCard).join("") +
        featured.map(createCarouselCard).join("");
}


/* =========================================================
   10. GRID RENDERING
   ========================================================= */

function renderProductGrid(selector, list) {

    const element = document.querySelector(selector);

    if (!element) return;

    element.innerHTML = list
        .map(createProductCard)
        .join("");
}


function renderGrids() {

    /* MOVING CAROUSEL */
    renderCarousel();


    /* FEATURED */
    renderProductGrid(
        "#featuredProducts",
        products.slice(0, 8)
    );


    /* FLASH DEALS */
    renderProductGrid(
        "#flashDeals",
        products
            .filter(p => p.oldPrice)
            .slice(0, 8)
    );


    /* TRENDING */
    renderProductGrid(
        "#trendingProducts",
        products.slice(8, 16)
    );


    /* BEST SELLERS */
    renderProductGrid(
        "#bestSellers",
        products
            .filter(p =>
                String(p.badge || "")
                    .toLowerCase()
                    .includes("seller")
            )
            .slice(0, 8)
    );


    /* NEW ARRIVALS */
    renderProductGrid(
        "#newArrivals",
        products.slice(24, 32)
    );


    /* ALL PRODUCTS */
    renderAllProducts(products);


    /* COMPANY COUNTS */
    updateCompanyCounts();
}


/* =========================================================
   11. ALL PRODUCTS
   ========================================================= */

function renderAllProducts(list) {

    const grid =
        document.querySelector("#allProducts");

    if (!grid) return;

    grid.innerHTML = list
        .map(createProductCard)
        .join("");

    const count =
        document.querySelector("#productCount");

    if (count) {
        count.textContent =
            `${list.length} products`;
    }
}


/* =========================================================
   12. COMPANY FILTER
   ========================================================= */

function filterByBrand(company, button = null) {

    activeCompany = company;
    activeCategory = "all";
    activeSearch = "";

    let filtered;

    if (company === "all") {
        filtered = products;
    } else {
        filtered = getCompanyProducts(company);
    }

    renderAllProducts(filtered);

    /*
       Update active filter buttons
    */

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => btn.classList.remove("active"));

    if (button) {
        button.classList.add("active");
    }

    /*
       Scroll to All Products
    */

    const section =
        document.querySelector("#allProducts");

    if (section) {
        section.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }
}


/* =========================================================
   13. CATEGORY FILTER
   ========================================================= */

function filterByCategory(category) {

    activeCategory = category;
    activeCompany = "all";

    const filtered =
        products.filter(p =>
            String(p.category || "").toLowerCase() ===
            String(category).toLowerCase()
        );

    renderAllProducts(filtered);

    const section =
        document.querySelector("#allProducts");

    if (section) {
        section.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }
}


/* =========================================================
   14. SEARCH
   ========================================================= */

function searchProducts(query) {

    activeSearch =
        String(query || "").trim().toLowerCase();

    if (!activeSearch) {

        let list = products;

        if (activeCompany !== "all") {
            list = getCompanyProducts(activeCompany);
        }

        if (activeCategory !== "all") {
            list = list.filter(
                p => p.category === activeCategory
            );
        }

        renderAllProducts(list);

        return;
    }

    const results = products.filter(product => {

        const searchable = [

            product.name,
            product.brand,
            product.company,
            product.category,
            product.subcategory,
            product.description,
            product.tags

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return searchable.includes(activeSearch);
    });

    renderAllProducts(results);
}


/* =========================================================
   15. SEARCH INPUT CONNECTION
   ========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    const searchInputs =
        document.querySelectorAll(
            'input[type="search"], .search-input'
        );

    searchInputs.forEach(input => {

        input.addEventListener("input", event => {

            searchProducts(event.target.value);

        });

        input.addEventListener("keydown", event => {

            if (event.key === "Enter") {

                event.preventDefault();

                searchProducts(event.target.value);

                const section =
                    document.querySelector("#allProducts");

                if (section) {
                    section.scrollIntoView({
                        behavior: "smooth"
                    });
                }
            }
        });

    });

});


/* =========================================================
   16. CART SYSTEM
   ========================================================= */

function addToCart(productId) {

    const product = getProduct(productId);

    if (!product) return;

    const existing =
        cart.find(item =>
            Number(item.id) === Number(productId)
        );

    if (existing) {

        existing.quantity += 1;

    } else {

        cart.push({
            id: Number(product.id),
            quantity: 1
        });

    }

    saveCart();

    updateCartUI();

    showToast(
        `${product.name} added to your cart`
    );
}


function removeFromCart(productId) {

    cart =
        cart.filter(
            item =>
                Number(item.id) !== Number(productId)
        );

    saveCart();

    updateCartUI();
}


function changeCartQuantity(productId, amount) {

    const item =
        cart.find(
            item =>
                Number(item.id) === Number(productId)
        );

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {

        removeFromCart(productId);
        return;
    }

    saveCart();

    updateCartUI();
}


function saveCart() {

    localStorage.setItem(
        "supplab_cart",
        JSON.stringify(cart)
    );
}


/* =========================================================
   17. CART TOTAL
   ========================================================= */

function getCartCount() {

    return cart.reduce(
        (total, item) =>
            total + Number(item.quantity || 0),
        0
    );
}


function getCartSubtotal() {

    return cart.reduce((total, item) => {

        const product =
            getProduct(item.id);

        if (!product) return total;

        return total +
            Number(product.price || 0) *
            Number(item.quantity || 0);

    }, 0);
}


/* =========================================================
   18. CART UI
   ========================================================= */

function updateCartUI() {

    const count =
        getCartCount();

    /*
       Supports different cart badge class names
       without changing your HTML structure.
    */

    document
        .querySelectorAll(
            ".cart-count, .cart-badge, #cartCount"
        )
        .forEach(element => {

            element.textContent = count;

            element.style.display =
                count > 0 ? "" : "none";
        });


    renderCartDrawer();
}


function renderCartDrawer() {

    const drawer =
        document.querySelector(
            "#cartDrawer"
        );

    if (!drawer) return;

    const itemsHTML =
        cart.map(item => {

            const product =
                getProduct(item.id);

            if (!product) return "";

            return `
                <div class="cart-item">

                    <div class="cart-item-image">
                        ${
                            product.image
                            ? `<img
                                src="${escapeHTML(product.image)}"
                                alt="${escapeHTML(product.name)}"
                               >`
                            : product.icon || "🛍️"
                        }
                    </div>

                    <div class="cart-item-info">

                        <strong>
                            ${escapeHTML(product.name)}
                        </strong>

                        <span>
                            ${money(product.price)}
                        </span>

                        <div class="cart-quantity">

                            <button
                                onclick="changeCartQuantity(${product.id}, -1)">
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick="changeCartQuantity(${product.id}, 1)">
                                +
                            </button>

                        </div>

                    </div>

                    <button
                        class="remove-cart"
                        onclick="removeFromCart(${product.id})">
                        ×
                    </button>

                </div>
            `;

        }).join("");


    const itemsContainer =
        drawer.querySelector(
            ".cart-items"
        );

    if (itemsContainer) {
        itemsContainer.innerHTML =
            itemsHTML ||
            `<div class="empty-cart">
                Your cart is empty.
             </div>`;
    }


    const subtotal =
        drawer.querySelector(
            ".cart-subtotal"
        );

    if (subtotal) {
        subtotal.textContent =
            money(getCartSubtotal());
    }
}


/* =========================================================
   19. OPEN / CLOSE CART
   ========================================================= */

function openCart() {

    const drawer =
        document.querySelector(
            "#cartDrawer"
        );

    if (drawer) {
        drawer.classList.add("open");
    }

    renderCartDrawer();
}


function closeCart() {

    const drawer =
        document.querySelector(
            "#cartDrawer"
        );

    if (drawer) {
        drawer.classList.remove("open");
    }
}


/* =========================================================
   20. WISHLIST
   ========================================================= */

function toggleWishlist(productId) {

    productId = Number(productId);

    if (wishlist.includes(productId)) {

        wishlist =
            wishlist.filter(
                id => id !== productId
            );

        showToast("Removed from wishlist");

    } else {

        wishlist.push(productId);

        showToast("Added to wishlist ♥");
    }

    localStorage.setItem(
        "supplab_wishlist",
        JSON.stringify(wishlist)
    );

    renderGrids();
}


/* =========================================================
   21. PRODUCT DETAIL
   ========================================================= */

function openProduct(productId) {

    const product =
        getProduct(productId);

    if (!product) return;

    /*
       If your existing website has a product modal,
       this will use it.
    */

    const modal =
        document.querySelector(
            "#productModal"
        );

    if (!modal) {

        console.log(
            "SUPPLAB PRODUCT:",
            product
        );

        return;
    }

    const title =
        modal.querySelector(
            ".product-modal-title"
        );

    const description =
        modal.querySelector(
            ".product-modal-description"
        );

    const price =
        modal.querySelector(
            ".product-modal-price"
        );

    const image =
        modal.querySelector(
            ".product-modal-image"
        );

    if (title) {
        title.textContent =
            product.name;
    }

    if (description) {
        description.textContent =
            product.description ||
            "Premium SUPPLAB product.";
    }

    if (price) {
        price.textContent =
            money(product.price);
    }

    if (image) {

        if (product.image) {

            image.innerHTML =
                `<img
                    src="${escapeHTML(product.image)}"
                    alt="${escapeHTML(product.name)}"
                 >`;

        } else {

            image.textContent =
                product.icon || "🛍️";
        }
    }

    modal.classList.add("open");
}


/* =========================================================
   22. ADD PRODUCT FROM PRODUCT MODAL
   ========================================================= */

function addProductFromModal(productId) {

    addToCart(productId);

}


/* =========================================================
   23. TOAST
   ========================================================= */

function showToast(message) {

    let toast =
        document.querySelector(
            "#supplabToast"
        );

    if (!toast) {

        toast =
            document.createElement("div");

        toast.id =
            "supplabToast";

        toast.style.position =
            "fixed";

        toast.style.right =
            "20px";

        toast.style.bottom =
            "20px";

        toast.style.zIndex =
            "99999";

        toast.style.padding =
            "14px 20px";

        toast.style.borderRadius =
            "10px";

        toast.style.background =
            "#111";

        toast.style.color =
            "#fff";

        toast.style.boxShadow =
            "0 10px 30px rgba(0,0,0,.25)";

        document.body.appendChild(toast);
    }

    toast.textContent = message;

    toast.style.opacity = "1";

    clearTimeout(
        window.supplabToastTimer
    );

    window.supplabToastTimer =
        setTimeout(() => {

            toast.style.opacity = "0";

        }, 2500);
}


/* =========================================================
   24. FLASH DEAL COUNTDOWN
   ========================================================= */

function updateCountdown() {

    const elements =
        document.querySelectorAll(
            ".countdown, #countdown, .deal-countdown"
        );

    const h =
        String(dealHours).padStart(2, "0");

    const m =
        String(dealMinutes).padStart(2, "0");

    const s =
        String(dealSeconds).padStart(2, "0");

    elements.forEach(element => {

        element.textContent =
            `${h}:${m}:${s}`;

    });
}


function startTimer() {

    updateCountdown();

    setInterval(() => {

        if (dealSeconds > 0) {

            dealSeconds--;

        } else if (dealMinutes > 0) {

            dealMinutes--;
            dealSeconds = 59;

        } else if (dealHours > 0) {

            dealHours--;
            dealMinutes = 59;
            dealSeconds = 59;

        } else {

            dealHours = 4;
            dealMinutes = 32;
            dealSeconds = 15;
        }

        updateCountdown();

    }, 1000);
}


/* =========================================================
   25. COMPANY CATALOG
   This is the important part:
   Each company automatically receives ONLY its own
   products from the 77-product database.
   ========================================================= */

function openCompanyCatalog(company) {

    const companyProducts =
        getCompanyProducts(company);

    activeCompany = company;
    activeCategory = "all";
    activeSearch = "";

    renderAllProducts(
        companyProducts
    );

    const title =
        document.querySelector(
            "#allProductsTitle"
        );

    if (title) {

        title.textContent =
            companyInfo[company]?.name ||
            company;

    }

    const section =
        document.querySelector(
            "#allProducts"
        );

    if (section) {

        section.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }

}


/* =========================================================
   26. PATCH EXISTING COMPANY CARDS
   Your current HTML can continue using:

   onclick="filterByBrand('iherb')"

   etc.
   ========================================================= */

document.addEventListener(
    "click",
    event => {

        const card =
            event.target.closest(
                ".brand-card"
            );

        if (!card) return;

        const onclick =
            card.getAttribute(
                "onclick"
            );

        if (!onclick) return;

        const match =
            onclick.match(
                /filterByBrand\(['"]([^'"]+)/
            );

        if (!match) return;

        /*
           The existing inline onclick will already
           call filterByBrand(). This listener exists
           only as a safety layer for future cards.
        */
    }
);

function initializeSUPPLAB() {

    /*
       Make sure the product database exists.
    */

    if (
        typeof products === "undefined" ||
        !Array.isArray(products)
    ) {

        console.error(
            "SUPPLAB: products array not found."
        );

        return;
    }


    /*
       Verify the 77 products.
    */

    console.log(
        `SUPPLAB catalog loaded: ${products.length} products`
    );


    /*
       Verify company distribution.
    */

    Object.keys(companyInfo)
        .forEach(company => {

            console.log(
                `${companyInfo[company].name}:`,
                getCompanyProducts(company).length,
                "products"
            );

        });


    renderGrids();

    updateCartUI();

    startTimer();
}


/* =========================================================
   30. START
   ========================================================= */

if (
    document.readyState === "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initializeSUPPLAB
    );

} else {

    initializeSUPPLAB();

}
