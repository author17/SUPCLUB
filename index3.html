/* =========================================================
   CREATE PRODUCT CARD
========================================================= */

function createProductCard(product) {

  const card = document.createElement("div");

  card.className = "product-card";

  card.innerHTML = `
    <div class="product-image">

      <img
        src="${product.image}"
        alt="${product.name}"
        loading="lazy"
      >

      <div class="product-badge">
        ${product.badge}
      </div>

      <button
        class="product-heart"
        type="button"
        aria-label="Add ${product.name} to wishlist"
      >
        ♡
      </button>

    </div>

    <div class="product-info">

      <div class="product-brand">
        ${product.brand}
      </div>

      <div class="product-name">
        ${product.name}
      </div>

      <div class="rating-row">

        <span class="stars">
          ${product.rating}
        </span>

        <span class="review-count">
          (${product.reviews})
        </span>

      </div>

      <div class="price-row">

        <span class="price">
          ${product.price}
        </span>

        <span class="old-price">
          ${product.oldPrice}
        </span>

      </div>

      <button
        class="add-cart"
        type="button"
      >
        ADD TO CART
      </button>

    </div>
  `;

  return card;
}


/* =========================================================
   POPULATE CAROUSELS
========================================================= */

function populateCarousel(trackId, source) {

  const track = document.getElementById(trackId);

  if (!track) return;

  track.innerHTML = "";

  let selectedProducts = [...products];

  /*
     Give each carousel slightly different products
     while keeping the same marketplace structure.
  */

  if (source === "flash") {
    selectedProducts = products.slice(2, 8);
  }

  if (source === "trending") {
    selectedProducts = [
      products[1],
      products[3],
      products[0],
      products[5],
      products[7],
      products[2]
    ];
  }

  if (source === "bestseller") {
    selectedProducts = [
      products[0],
      products[1],
      products[3],
      products[4],
      products[5],
      products[7]
    ];
  }

  if (source === "new") {
    selectedProducts = [
      products[6],
      products[2],
      products[4],
      products[7],
      products[0],
      products[5]
    ];
  }

  if (source === "featured") {
    selectedProducts = [
      products[1],
      products[0],
      products[3],
      products[4],
      products[2],
      products[7]
    ];
  }

  if (source === "all") {
    selectedProducts = [...products];
  }

  /*
     Create TWO copies.

     This is important because the CSS animation moves
     the track by -50%. The second copy makes the
     carousel loop continuously.
  */

  const firstSet = selectedProducts.map(createProductCard);
  const secondSet = selectedProducts.map(createProductCard);

  firstSet.forEach(card => track.appendChild(card));
  secondSet.forEach(card => track.appendChild(card));

  /*
     Remove any old inline transform that may have been
     created by the manual controls.
  */

  track.style.transform = "";
}


/* =========================================================

========================================================= */

/* =========================================================
   MANUAL CAROUSEL CONTROLS
========================================================= */

function moveCarousel(trackId, direction) {

  const track = document.getElementById(trackId);

  if (!track) return;

  /*
     Pause CSS animation while manually moving.
  */

  track.style.animation = "none";

  const currentTransform = window.getComputedStyle(track).transform;

  let currentX = 0;

  if (currentTransform !== "none") {

    const matrix = new DOMMatrix(currentTransform);

    currentX = matrix.m41;
  }

  const amount = 250;

  let newX = currentX + (direction * amount);

  /*
     Keep movement inside reasonable bounds.
  */

  const parent = track.parentElement;

  const maxScroll =
    Math.max(0, track.scrollWidth / 2 - parent.clientWidth);

  if (newX > 0) {
    newX = 0;
  }

  if (Math.abs(newX) > maxScroll) {
    newX = -maxScroll;
  }

  track.style.transform =
    `translateX(${newX}px)`;

  /*
     Restart automatic scrolling after 4 seconds.
  */

  clearTimeout(track._carouselRestart);

  track._carouselRestart = setTimeout(() => {

    track.style.transform = "";

    track.style.animation =
      "productRoll 55s linear infinite";

  }, 4000);
}


/* =========================================================
   WISHLIST BUTTONS
========================================================= */

document.addEventListener("click", function(event) {

  const heart = event.target.closest(".product-heart");

  if (!heart) return;

  event.preventDefault();

  heart.classList.toggle("active");

  if (heart.classList.contains("active")) {
    heart.textContent = "♥";
  } else {
    heart.textContent = "♡";
  }

});


/* =========================================================
   ADD TO CART
========================================================= */

let cartTotal = 0;

document.addEventListener("click", function(event) {

  const button = event.target.closest(".add-cart");

  if (!button) return;

  cartTotal++;

  const cartCount =
    document.getElementById("cartCount");

  if (cartCount) {
    cartCount.textContent = cartTotal;
  }

  button.textContent = "ADDED ✓";

  setTimeout(() => {
    button.textContent = "ADD TO CART";
  }, 1200);

});


/* =========================================================
   COUNTDOWN
========================================================= */

let countdownSeconds = 8 * 60 * 60 + 45 * 60 + 22;

function updateCountdown() {

  if (countdownSeconds <= 0) {
    countdownSeconds = 8 * 60 * 60 + 45 * 60 + 22;
  }

  const hours =
    Math.floor(countdownSeconds / 3600);

  const minutes =
    Math.floor((countdownSeconds % 3600) / 60);

  const seconds =
    countdownSeconds % 60;

  const hoursElement =
    document.getElementById("hours");

  const minutesElement =
    document.getElementById("minutes");

  const secondsElement =
    document.getElementById("seconds");

  if (hoursElement) {
    hoursElement.textContent =
      String(hours).padStart(2, "0");
  }

  if (minutesElement) {
    minutesElement.textContent =
      String(minutes).padStart(2, "0");
  }

  if (secondsElement) {
    secondsElement.textContent =
      String(seconds).padStart(2, "0");
  }

  countdownSeconds--;
}

updateCountdown();

setInterval(updateCountdown, 1000);


/* =========================================================
   SEARCH
========================================================= */

const searchInput =
  document.getElementById("searchInput");

const searchResults =
  document.getElementById("searchResults");


function showSearchResults(query) {

  if (!searchResults) return;

  const value = query.trim().toLowerCase();

  if (!value) {
    searchResults.classList.remove("active");
    searchResults.innerHTML = "";
    return;
  }

  const matches = products.filter(product =>
    product.name.toLowerCase().includes(value) ||
    product.brand.toLowerCase().includes(value)
  );

  if (!matches.length) {

    searchResults.innerHTML = `
      <div class="search-result-item">
        <strong>No products found</strong>
        <span>Try another search</span>
      </div>
    `;

  } else {

    searchResults.innerHTML = matches.map(product => `
      <div class="search-result-item">

        <img
          src="${product.image}"
          alt="${product.name}"
        >

        <div>
          <strong>${product.name}</strong>
          <span>${product.price}</span>
        </div>

      </div>
    `).join("");

  }

  searchResults.classList.add("active");
}


if (searchInput) {

  searchInput.addEventListener("input", function() {
    showSearchResults(this.value);
  });

}


/* =========================================================
   CLOSE SEARCH WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener("click", function(event) {

  if (
    searchResults &&
    searchInput &&
    !searchResults.contains(event.target) &&
    event.target !== searchInput
  ) {

    searchResults.classList.remove("active");

  }

});
