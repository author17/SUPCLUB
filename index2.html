<script>
// PRODUCT DATA
const myproteinProducts = [
  { id: 'mp1', name: 'Impact Whey Protein', brand: 'MyProtein', price: 19.99, oldPrice: 29.99, rating: 4.8, size: '2.5kg - Chocolate', icon: '🥤', badge: 'BEST SELLER' },
  { id: 'mp2', name: 'Creatine Monohydrate', brand: 'MyProtein', price: 13.99, oldPrice: 19.99, rating: 4.7, size: '500g - Unflavored', icon: '💊', badge: 'TOP RATED' },
  { id: 'mp3', name: 'Clear Whey Isolate', brand: 'MyProtein', price: 31.46, oldPrice: 44.95, rating: 4.3, size: '500g - Lemon & Lime', icon: '🍋', badge: 'NEW' },
  { id: 'mp4', name: 'Slow-Release Casein', brand: 'MyProtein', price: 41.99, oldPrice: 59.99, rating: 4.0, size: '1kg - Vanilla', icon: '🌙' }
];

const iherbProducts = [
  { id: 'ih1', name: 'Omega-3 Premium Fish Oil', brand: 'California Gold Nutrition', price: 12.20, rating: 4.9, size: '100 Softgels', icon: '🐟', badge: '#1 SELLER' },
  { id: 'ih2', name: 'High Absorption Magnesium', brand: "Doctor's Best", price: 23.99, rating: 4.8, size: '240 Tablets', icon: '💊' },
  { id: 'ih3', name: 'Vitamin D-3 & K-2', brand: 'NOW Foods', price: 9.17, rating: 4.8, size: '120 Capsules', icon: '☀️', badge: 'VALUE' },
  { id: 'ih4', name: 'CollagenUP® Marine Peptides', brand: 'California Gold Nutrition', price: 19.21, rating: 4.7, size: '206g - Unflavored', icon: '✨' }
];

const suplabProducts = [
  { id: 'sl1', name: 'SUPLAB Pre-Workout Elite', brand: 'SUPLAB Signature', price: 34.90, rating: 4.9, size: '300g - Fruit Punch', icon: '⚡', badge: 'EXCLUSIVE' },
  { id: 'sl2', name: 'SUPLAB Recovery BCAA+', brand: 'SUPLAB Signature', price: 24.90, oldPrice: 32.90, rating: 4.7, size: '400g - Watermelon', icon: '🧬', badge: 'PREMIUM' }
];

let cart = [];

// Combine all products in one place
const allProducts = [
  ...myproteinProducts,
  ...iherbProducts,
  ...suplabProducts
];

// RENDER PRODUCTS
function renderProducts() {
  const createCard = (p) => `
    <div class="product-card">
      <div class="product-image">
        ${p.icon}
        ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
      </div>

      <div class="product-info">
        <div class="product-brand">${p.brand}</div>
        <div class="product-name">${p.name}</div>

        <div class="product-rating">
          ${'⭐'.repeat(Math.floor(p.rating))} (${p.rating})
        </div>

        <div class="product-size">${p.size}</div>

        <div class="product-price">
          <span class="price-current">
            €${p.price.toFixed(2)}
          </span>

          ${p.oldPrice
            ? `<span class="price-original">€${p.oldPrice.toFixed(2)}</span>`
            : ''
          }
        </div>

        <button
          class="btn-add-cart"
          onclick="addToCart('${p.id}')"
          type="button"
        >
          ΠΡΟΣΘΗΚΗ ΣΤΟ ΚΑΛΑΘΙ
        </button>
      </div>
    </div>
  `;

  document.getElementById('myproteinProducts').innerHTML =
    myproteinProducts.map(createCard).join('');

  document.getElementById('iherbProducts').innerHTML =
    iherbProducts.map(createCard).join('');

  document.getElementById('suplabProducts').innerHTML =
    suplabProducts.map(createCard).join('');
}

// SWITCH BRAND
function switchBrand(brand) {
  const section = document.getElementById(`${brand}Section`);
  const tab = document.querySelector(`.brand-tab.${brand}`);

  if (!section || !tab) return;

  document.querySelectorAll('.brand-section')
    .forEach(section => section.classList.remove('active'));

  document.querySelectorAll('.brand-tab')
    .forEach(tab => tab.classList.remove('active'));

  section.classList.add('active');
  tab.classList.add('active');

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

// CAROUSEL
function scrollCarousel(brand, amount) {
  const carousel = document.getElementById(`${brand}Videos`);

  if (!carousel) return;

  carousel.scrollBy({
    left: amount,
    behavior: 'smooth'
  });
}

// ADD TO CART
function addToCart(id) {
  const product = allProducts.find(p => p.id === id);

  if (!product) {
    console.error(`Product not found: ${id}`);
    return;
  }

  const existing = cart.find(item => item.id === id);

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({
      ...product,
      quantity: 1
    });
  }

  updateCart();
  showToast(`✓ Προστέθηκε: ${product.name}`);
}

// UPDATE QUANTITY
function updateQty(id, delta) {
  const item = cart.find(item => item.id === id);

  if (!item) return;

  item.quantity += delta;

  if (item.quantity <= 0) {
    cart = cart.filter(item => item.id !== id);
  }

  updateCart();
}

// UPDATE CART UI
function updateCart() {
  const itemsContainer = document.getElementById('cartItems');
  const badge = document.getElementById('cartBadge');

  const subtotal = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  const totalItems = cart.reduce(
    (sum, item) => sum + item.quantity,
    0
  );

  // Badge
  badge.textContent = totalItems;
  badge.classList.toggle('visible', totalItems > 0);

  // Empty cart
  if (cart.length === 0) {
    itemsContainer.innerHTML = `
      <div style="
        text-align: center;
        padding: 3rem;
        color: var(--text-secondary);
      ">
        <div style="
          font-size: 4rem;
          margin-bottom: 1rem;
        ">🛒</div>

        <h3>Το καλάθι σας είναι άδειο</h3>
      </div>
    `;
  } else {

    // Cart items
    itemsContainer.innerHTML = cart.map(item => `
      <div class="cart-item">

        <div class="cart-item-icon">
          ${item.icon}
        </div>

        <div class="cart-item-info">

          <div class="cart-item-name">
            ${item.name}
          </div>

          <div class="cart-item-controls">

            <button
              class="qty-btn"
              onclick="updateQty('${item.id}', -1)"
              type="button"
              aria-label="Μείωση ποσότητας"
            >
              −
            </button>

            <span>${item.quantity}</span>

            <button
              class="qty-btn"
              onclick="updateQty('${item.id}', 1)"
              type="button"
              aria-label="Αύξηση ποσότητας"
            >
              +
            </button>

            <strong style="
              color: var(--accent);
              margin-left: auto;
            ">
              €${(item.price * item.quantity).toFixed(2)}
            </strong>

          </div>

        </div>

      </div>
    `).join('');
  }

  // Totals
  document.getElementById('cartSubtotal').textContent =
    `€${subtotal.toFixed(2)}`;

  document.getElementById('cartTotal').textContent =
    `€${subtotal.toFixed(2)}`;
}

// TOGGLE CART
function toggleCart() {
  const drawer = document.getElementById('cartDrawer');
  const overlay = document.getElementById('cartOverlay');

  const isOpen = drawer.classList.contains('active');

  drawer.classList.toggle('active', !isOpen);
  overlay.classList.toggle('active', !isOpen);

  // Prevent background scrolling while cart is open
  document.body.style.overflow = !isOpen ? 'hidden' : '';
}

// CHECKOUT
function checkout() {
  if (cart.length === 0) {
    showToast('Το καλάθι είναι άδειο');
    return;
  }

  showToast('🎉 Η παραγγελία ολοκληρώθηκε επιτυχώς!');

  cart = [];
  updateCart();

  // Close cart
  document.getElementById('cartDrawer').classList.remove('active');
  document.getElementById('cartOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

// TOAST
function showToast(message) {
  const container = document.getElementById('toastContainer');

  const toast = document.createElement('div');

  toast.className = 'toast';

  toast.innerHTML = `
    <div style="font-size: 1.5rem;">✓</div>
    <div style="
      flex: 1;
      font-weight: 600;
    ">
      ${message}
    </div>
  `;

  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('hiding');

    setTimeout(() => {
      toast.remove();
    }, 300);

  }, 3000);
}

// CLOSE CART WITH ESC
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    const drawer = document.getElementById('cartDrawer');

    if (drawer.classList.contains('active')) {
      toggleCart();
    }
  }
});

// INITIALIZE
renderProducts();
updateCart();
</script>
