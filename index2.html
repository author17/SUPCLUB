<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPLAB — Premium Multi-Brand E-Commerce</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0a0a0a;
            --secondary: #151515;
            --accent: #ff3c00;
            --accent-hover: #ff5500;
            --gold: #ffd700;
            --blue: #0066ff;
            --text: #ffffff;
            --text-secondary: #a0a0a0;
            --border: #2a2a2a;
            --success: #00d97e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--primary);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; cursor: pointer; }
        
        /* PROMO BARS */
        .promo-bar-top {
            background: linear-gradient(90deg, var(--accent) 0%, #ff6b35 100%);
            color: white;
            text-align: center;
            padding: 0.75rem;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .promo-bar-flash {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a1a0a 100%);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 2rem auto;
            max-width: 900px;
            text-align: center;
        }
        .promo-bar-flash h3 {
            color: var(--gold);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0;
        }
        .countdown-item {
            background: var(--primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            min-width: 70px;
        }
        .countdown-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
            display: block;
            line-height: 1;
        }
        .countdown-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-top: 0.25rem;
        }
        
        /* HEADER */
        header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            padding: 1rem 2rem;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--blue);
            letter-spacing: 2px;
        }
        .logo span { color: var(--accent); }
        .search-box { flex: 1; max-width: 500px; position: relative; }
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            font-size: 0.95rem;
        }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
        }
        .header-actions { display: flex; gap: 1.5rem; align-items: center; }
        .icon-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.3rem;
            position: relative;
            transition: color 0.3s;
        }
        .icon-btn:hover { color: var(--accent); }
        .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        /* NAVIGATION */
        .main-nav {
            background: var(--secondary);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 0;
            overflow-x: auto;
        }
        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 1.5rem;
            padding: 0 2rem;
            white-space: nowrap;
        }
        .nav-link {
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .nav-link:hover, .nav-link.active { color: var(--accent); }
        
        /* HERO */
        .hero {
            padding: 4rem 2rem;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            text-align: center;
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, var(--blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem; }
        
        /* SECTIONS */
        .section { padding: 3rem 2rem; max-width: 1400px; margin: 0 auto; }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: 900;
        }
        .view-all {
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
        }
        .view-all:hover { text-decoration: underline; }
        
        /* MANUAL CAROUSEL (iHerb Style) */
        .carousel-wrapper {
            position: relative;
            margin: 2rem 0;
        }
        .carousel-container {
            overflow: hidden;
            position: relative;
        }
        .carousel-track {
            display: flex;
            gap: 1.5rem;
            transition: transform 0.5s ease;
        }
        .carousel-card {
            min-width: 280px;
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .carousel-card-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
        }
        .carousel-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 60, 0, 0.9);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
        }
        .carousel-nav-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-50%) scale(1.1);
        }
        .carousel-nav-btn.prev { left: 1rem; }
        .carousel-nav-btn.next { right: 1rem; }
        
        /* PRODUCT GRID */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 15px 40px rgba(255, 60, 0, 0.15);
        }
        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            position: relative;
        }
        .product-badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: var(--accent);
            color: white;
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
        }
        .product-info { padding: 1.25rem; }
        .product-brand {
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
        }
        .product-name {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            min-height: 48px;
        }
        .product-rating { color: var(--gold); font-size: 0.8rem; margin-bottom: 0.5rem; }
        .product-price { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
        .price-current { font-size: 1.3rem; font-weight: 900; color: var(--accent); }
        .price-original { font-size: 0.85rem; color: var(--text-secondary); text-decoration: line-through; }
        .discount-badge {
            background: rgba(0, 217, 126, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .btn-add-cart {
            width: 100%;
            padding: 0.7rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-add-cart:hover { background: var(--accent-hover); }
        
        /* HEALTH CATEGORIES */
        .health-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .health-category {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .health-category:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }
        .health-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .health-name { font-weight: 700; font-size: 0.85rem; }
        
        /* BRANDS */
        .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        .brand-card {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .brand-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }
        .brand-logo { font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem; }
        
        /* CART SIDEBAR */
        .cart-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .cart-overlay.active { opacity: 1; visibility: visible; }
        .cart-sidebar {
            position: fixed;
            top: 0; right: -450px;
            width: 450px;
            max-width: 100vw;
            height: 100vh;
            background: var(--secondary);
            border-left: 1px solid var(--border);
            z-index: 2001;
            display: flex;
            flex-direction: column;
            transition: right 0.4s;
        }
        .cart-sidebar.active { right: 0; }
        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-items { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }
        .cart-item-image {
            width: 70px; height: 70px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 700; margin-bottom: 0.5rem; }
        .qty-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--primary);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            font-weight: 700;
        }
        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--primary);
        }
        
        /* FOOTER */
        footer {
            background: var(--secondary);
            border-top: 1px solid var(--border);
            padding: 3rem 2rem 1rem;
            margin-top: 4rem;
        }
        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
        }
        .footer-section h4 { margin-bottom: 1rem; color: var(--blue); }
        .footer-section a {
            display: block;
            color: var(--text-secondary);
            padding: 0.3rem 0;
            cursor: pointer;
        }
        .footer-section a:hover { color: var(--text); }
        .footer-bottom {
            max-width: 1400px;
            margin: 2rem auto 0;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .header-content { flex-wrap: wrap; }
            .search-box { order: 3; width: 100%; }
            .carousel-nav-btn { width: 40px; height: 40px; font-size: 1.2rem; }
            .cart-sidebar { width: 100vw; right: -100vw; }
        }
    </style>
</head>
<body>

    <div class="promo-bar-top">

    <header>

    <nav class="main-nav">
        <div class="nav-content">
            <a class="nav-link" onclick="navigate('/')">Home</a>

    <!-- MAIN CONTENT -->
    <div id="app"></div>
