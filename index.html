<html lang="en">
<head>

/* =========================================================
   SUPPLAB MARKETPLACE
   Updated Palette: Modern Ocean / Deep Blue + Cyan + Gold
========================================================= */

* {

  padding: 0;

}

  background: var(--white);
}

a {

  text-decoration: none;

button {

========================================================= */

  right: 0;
  top: 0;
